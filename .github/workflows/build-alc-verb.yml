name: Build alc-verb

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15          # currently available (or use macos-latest / macos-26)

    steps:
      - name: Checkout AppleALC
        uses: actions/checkout@v4
        with:
          repository: acidanthera/AppleALC
          path: AppleALC

      - name: Build alc-verb
        working-directory: AppleALC
        run: |
          xcodebuild -project AppleALC.xcodeproj \
                     -target alc-verb \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: alc-verb
          path: AppleALC/build/Release/alc-verb
